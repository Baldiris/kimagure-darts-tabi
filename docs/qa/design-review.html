<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>画面レビュー</title>
<style>body{margin:0;background:#e9e8e2;font:14px system-ui;color:#343a30}header{display:flex;gap:10px;align-items:center;padding:16px 24px}button{padding:9px 15px;background:#fffef9;border:1px solid #aaa;cursor:pointer}button[aria-pressed=true]{background:#c54b34;color:white;border-color:#c54b34}main{padding:0 24px 24px}iframe{display:block;width:375px;height:812px;border:1px solid #afb7ab;background:#f7f6f0}span{margin-left:10px}</style></head>
<body><header><strong>表示幅</strong><button data-width="375" aria-pressed="true">375px</button><button data-width="390" aria-pressed="false">390px</button><button data-width="768" aria-pressed="false">768px</button><span>メイン画面</span></header><main><iframe title="旅先ダーツの画面レビュー" src="../#explore"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></body></html>
